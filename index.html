<!DOCTYPE html>
<html lang="en">

<head>
    <title>VR Museum Experience</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <!-- A-Frame Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <!-- Custom Components -->
    <script src="js/components/artwork-frame.js"></script>
    <script src="js/components/info-panel.js"></script>
    <script src="js/components/smooth-navigation.js"></script>
    <script src="js/components/artwork-zoom.js"></script>
    <script src="js/main.js"></script>
</head>

<body>
    <a-scene loading-screen="dotsColor: #fff; backgroundColor: #000">
        <!-- Asset Management System -->
        <a-assets>
            <!-- Artwork -->
            <img id="starry-night" src="assets/artwork/starry-night.jpg" alt="Starry Night" crossorigin="anonymous">
            <img id="mona-lisa" src="assets/artwork/mona-lisa.jpg" alt="Mona Lisa" crossorigin="anonymous">
            <img id="the-scream" src="assets/artwork/the-scream.jpg" alt="The Scream" crossorigin="anonymous">
            <img id="girl-with-pearl" src="assets/artwork/girl-with-pearl.jpg" alt="Girl with a Pearl Earring" crossorigin="anonymous">

            <!-- Textures -->
            <img id="marble-floor" src="assets/textures/marble-floor.jpg" alt="Marble Floor Texture" crossorigin="anonymous">
            <img id="wall-texture" src="assets/textures/wall-texture.jpg" alt="Wall Texture" crossorigin="anonymous">
            <img id="ceiling-texture" src="assets/textures/ceiling-texture.jpg" alt="Ceiling Texture" crossorigin="anonymous">
            <img id="column-texture" src="assets/textures/column-texture.jpg" alt="Column Texture" crossorigin="anonymous">
            <img id="frame-texture" src="assets/textures/frame-texture.jpg" alt="Frame Texture" crossorigin="anonymous">
        </a-assets>

        <!-- Museum Structure -->
        <a-entity id="museum-structure">
        </a-entity>

        <!-- Camera Rig -->
        <a-entity id="camera-rig" position="0 1.6 3">
            <a-camera look-controls="reverseMouseDrag: true" wasd-controls="acceleration: 15" position="0 0 0">
                <a-cursor color="#444" raycaster="far: 20"
                    animation__click="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150; startEvents: click"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; dur: 150; startEvents: fusing"></a-cursor>
            </a-camera>
        </a-entity>

        <!-- Environment -->
        <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-overlay">
        <div class="loading-content">
            <h1>VR Museum</h1>
            <div class="loading-bar"></div>
            <p>Loading your experience...</p>
        </div>
    </div>

    <script>
        // Handle loading screen
        document.querySelector('a-scene').addEventListener('loaded', function () {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        });

        // Handle VR mode
        document.querySelector('a-scene').addEventListener('enter-vr', function () {
            const cameraRig = document.getElementById('camera-rig');
            cameraRig.setAttribute('position', { x: 0, y: 1.6, z: 3 });
        });
    </script>
</body>

</html>
